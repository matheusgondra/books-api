api:
  jwt:
    secret: ${JWT_SECRET:mySecretKey}

logging:
  level:
    root: INFO
    com.matheusgondra.books: ${LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
          - info
          - metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name:books}
      env: production
    distribution:
        percentiles-histogram:
          http:
            server:
              requests: true


springdoc:
  api-docs:
    path: /api-docs

scalar:
  path: /docs
  theme: blue-planet
  dark-mode: true
  page-title: Books API Documentation

server:
  port: ${PORT:8080}

spring:
  application:
    name: books
  web:
    error:
      include-stacktrace: never
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/books_db}
    username: ${DB_USER:dev}
    password: ${DB_PASSWORD:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
